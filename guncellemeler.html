/* AKIŞ ARTIK KOD İÇİNDE DEĞİL.

   Buradaki liste bir JavaScript dizisiydi ve tam da bu yüzden
   14 Ağustos 2026'da kalmıştı: bir haber eklemek için dosyayı
   düzenleyip yeniden dağıtmak gerekiyordu. Artık sunucudan
   geliyor ve yönetim panelinden yazılıyor (bkz. server/haber.js).

   Eski altı kayıt silinmedi; haber dosyası ilk oluşturulurken
   tohum olarak taşındı. */
const HB_FILTRE = { tur: "" };

async function haberleriCiz(){
  const kutu = document.getElementById("updates");
  kutu.innerHTML = spinnerBox("Yükleniyor…");
  let liste = [];
  try {
    const r = await fetch(API_BASE + "/haberler" + (HB_FILTRE.tur ? "?tur=" + HB_FILTRE.tur : ""));
    liste = (await r.json()).items || [];
  } catch {
    kutu.innerHTML = notice("<span>⚠️</span><span>Güncellemeler alınamadı.</span>");
    return;
  }
  if (!liste.length) {
    kutu.innerHTML = notice("<span>📰</span><span>Bu türde henüz kayıt yok.</span>");
    return;
  }
  kutu.innerHTML = '<div class="hb-liste tek">' + liste.map(haberKart).join("") + "</div>";
}

function haberFiltre(tur, btn){
  HB_FILTRE.tur = tur;
  document.querySelectorAll("#hbFiltre .btn").forEach((b) => b.classList.remove("btn-primary"));
  if (btn) btn.classList.add("btn-primary");
  haberleriCiz();
}

haberleriCiz();
</script>
