<!-- Arama motorlarına kapalı: yönetim ekranının dizine girmesinin hiçbir
     faydası yok. Güvenliği bu sağlamıyor — sunucu her isteği ayrıca
     doğruluyor ve yetkisiz isteğe 403 dönüyor. -->
<meta name="robots" content="noindex, nofollow">

["gece","light","dark"].indexOf(_t)>=0?_t:"gece")}catch(e){}</script>

<body>
<div id="app-header"></div>

<section class="page-strip">
  <div class="container">
    <p class="eyebrow">YALNIZCA YÖNETİCİ</p>
    <h1>YÖNETİM</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <div id="yonetimGovde">
      <div class="card"><p class="muted" style="margin:0">Yükleniyor…</p></div>
    </div>
  </div>
</section>

<div id="app-footer"></div>
<script src="assets/js/app.js"></script>
<script>
/* ============================================================
   YÖNETİM EKRANI
   ------------------------------------------------------------
   Yönetici uçları (/api/admin/*) vardı ama onları kullanan hiçbir ekran
   YOKTU: kullanıcıları görmenin tek yolu Tokmakçılar tablosuydu ve oraya
   yalnızca PUAN TOPLAMIŞ kişiler düşüyor. Yani küfürlü bir adla kayıt
   olup hiç oynamamış biri sitede hiçbir yerde görünmüyordu — tam da
   silinmesi istenen hesaplar.

   Bu sayfa o boşluğu kapatıyor: ada göre ara, yasakla, yasağı kaldır,
   gerekiyorsa hesabı kalıcı olarak sil.

   GÜVENLİK: buradaki hiçbir kontrol güvenlik sağlamıyor. Sayfa yalnızca
   ekran çiziyor; asıl karar sunucuda veriliyor. Silme, kullanıcı adının
   birebir yazılmasını istiyor — hem burada (kazayı önlemek için) hem
   sunucuda (asıl kilit).
   ============================================================ */
const API = (typeof API_BASE !== "undefined") ? API_BASE : "/api";
let BEN = null;

const cagir = async (yol, govde) => {
  const r = await fetch(API + yol, {
    method: govde ? "POST" : "GET", credentials: "same-origin",
    headers: govde ? { "content-type": "application/json" } : {},
    body: govde ? JSON.stringify(govde) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
};

function kapali(mesaj) {
  document.getElementById("yonetimGovde").innerHTML =
    '<div class="card"><div class="card-head"><span class="dot">🔒</span><h3>Erişim yok</h3></div>' +
    '<p class="muted" style="margin:0">' + esc(mesaj) + '</p></div>';
}

async function baslat() {
  const ben = await cagir("/auth/me");
  BEN = ben.ok ? ben.j : null;
  if (!BEN || !BEN.username)
    return kapali("Bu sayfayı görmek için yönetici hesabıyla giriş yapmalısınız.");
  /* Yönetici mi? Bayrağa güvenmek yerine gerçek uca soruyoruz: cevap
     403 ise yönetici değil. Tek doğru sunucuda. */
  const dene = await cagir("/admin/users");
  if (dene.status === 403) return kapali('"' + BEN.username + '" bir yönetici hesabı değil.');
  if (!dene.ok) return kapali("Sunucuya ulaşılamadı.");
  ciz();
  yukle("");
}

function ciz() {
  document.getElementById("yonetimGovde").innerHTML =
    '<div class="card">' +
      '<div class="card-head"><span class="dot">👥</span><h3>Kullanıcılar</h3>' +
        '<span class="badge" id="yonSayac" style="margin-left:auto">—</span></div>' +
      '<p class="muted" style="font-size:.84rem;margin:0 0 12px">' +
        'Ada göre ara. Arama boşsa en son kayıt olanlar listelenir — uygunsuz adlar ' +
        'çoğunlukla yeni hesaplarda çıkıyor.</p>' +
      '<div class="flex gap-8" style="margin-bottom:14px">' +
        '<input type="search" id="yonAra" placeholder="Kullanıcı adı ara…" autocomplete="off" ' +
          'oninput="araDegisti(this.value)" style="flex:1;min-width:0">' +
        '<button class="btn btn-ghost" onclick="yukle(document.getElementById(\'yonAra\').value)">Ara</button>' +
      '</div>' +
      '<div class="flex gap-8" style="margin-bottom:14px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-mini" onclick="denemeleriBul()">🧪 Deneme hesaplarını listele</button>' +
        '<span id="yonDeneme" class="muted" style="font-size:.76rem"></span>' +
      '</div>' +
      '<div id="yonListe"></div>' +
    '</div>' +
    /* Elle puan: yayın günü sunucu yeniden başlatıldığında devam eden
       yarışma turları silinmişti ve bir oyuncu 12 soru bilip puan
       alamamıştı. Oturumlar artık kalıcı ama YAŞANMIŞ kaybı telafi
       etmenin bir yolu olması gerekiyor. */
    '<div class="card">' +
      '<div class="card-head"><span class="dot">🔧</span><h3>Elle puan</h3></div>' +
      '<p class="muted" style="font-size:.84rem;margin:0 0 12px">' +
        'Bir hata yüzünden puanı yazılmayan kişiye telafi. Sebep zorunlu ve kayda geçer; ' +
        'eksi değer de yazılabilir. Elle verilen puan “oynanan oyun” sayılmaz.</p>' +
      '<div class="flex gap-8" style="flex-wrap:wrap">' +
        '<input id="epAd" placeholder="Kullanıcı adı" autocomplete="off" style="flex:2 1 160px;min-width:0">' +
        '<input id="epPuan" type="number" placeholder="Puan" style="flex:0 1 90px;min-width:0">' +
        '<input id="epSebep" placeholder="Sebep (zorunlu)" autocomplete="off" style="flex:3 1 200px;min-width:0">' +
        '<button class="btn btn-primary" onclick="ellePuan()">Ekle</button>' +
      '</div>' +
      '<div id="epSonuc" class="muted" style="font-size:.82rem;margin-top:10px"></div>' +
    '</div>' +

    /* HABERLER — oyundaki dengelemeler ve duyurular.

       Metin BURADAN giriliyor çünkü Clash Royale denge değişiklikleri
       için açık bir uç yok. Eskiden guncellemeler.html içine gömülüydü
       ve bir haber eklemek dağıtım gerektiriyordu — tam bu yüzden sayfa
       14 Ağustos'ta kalmıştı. */
    '<div class="card" style="margin-top:16px">' +
      '<div class="card-head"><span class="dot">📰</span><h3>Clash Royale haberi ekle</h3>' +
        '<span class="badge" id="hbSayac" style="margin-left:auto">—</span></div>' +
      '<p class="muted" style="font-size:.84rem;margin:0 0 12px">' +
        'Ana sayfada “Clash Royale Haberleri” bölümünde ve haberler sayfasında görünür. ' +
        'Denge duyurusunu olduğu gibi yapıştırabilirsin — satır sonları korunuyor. ' +
        '“Öne çıkar” işaretlenen kayıtlar ana sayfada en üstte durur.</p>' +
      '<div class="flex gap-8" style="flex-wrap:wrap;margin-bottom:8px">' +
        '<select id="hbTur" style="flex:0 1 140px">' +
          '<option value="denge">Denge değişikliği</option>' +
          '<option value="guncelleme">Güncelleme</option>' +
          '<option value="yakinda">Yakında geliyor</option>' +
          '<option value="etkinlik">Etkinlik</option>' +
        '</select>' +
        '<input id="hbTarih" type="date" style="flex:0 1 160px">' +
        '<label class="muted" style="display:flex;align-items:center;gap:6px;font-size:.84rem">' +
          '<input id="hbOne" type="checkbox"> Öne çıkar</label>' +
      '</div>' +
      '<input id="hbBaslik" placeholder="Başlık (zorunlu)" autocomplete="off" style="width:100%;margin-bottom:8px">' +
      '<textarea id="hbMetin" placeholder="Açıklama — ya da oyun içi denge duyurusunu olduğu gibi yapıştır" ' +
        'rows="6" style="width:100%;margin-bottom:8px"></textarea>' +
      '<div class="flex gap-8" style="margin-bottom:10px;flex-wrap:wrap">' +
        '<button class="btn btn-ghost" style="font-size:.82rem" onclick="duyuruAyristir()">⚖️ Duyuruyu düzenle</button>' +
        '<span class="muted" style="font-size:.78rem;align-self:center">' +
          'Oyun içi denge duyurusunu yapıştırıp bas — kart adları düzeltilip listeye çevrilir.</span>' +
      '</div>' +
      '<div class="flex gap-8">' +
        '<button class="btn btn-primary" id="hbGonder" onclick="haberEkle()">Yayınla</button>' +
        '<button class="btn btn-ghost" id="hbVazgec" hidden onclick="haberVazgec()">Vazgeç</button>' +
      '</div>' +
      '<div id="hbSonuc" class="muted" style="font-size:.82rem;margin-top:10px"></div>' +
      '<div id="hbListe" style="margin-top:14px"></div>' +
    '</div>';

  haberPaneli();
}

/* Mevcut haberler + silme. */
async function haberPaneli(){
  const kutu = document.getElementById('hbListe');
  if (!kutu) return;
  const t = document.getElementById('hbTarih');
  if (t && !t.value) t.value = new Date().toISOString().slice(0, 10);
  let liste = [];
  try { liste = (await (await fetch(API_BASE + '/haberler')).json()).items || []; }
  catch { kutu.innerHTML = '<p class="muted">Haberler alınamadı.</p>'; return; }
  const sayac = document.getElementById('hbSayac');
  if (sayac) sayac.textContent = liste.length + ' kayıt';
  kutu.innerHTML = liste.slice(0, 15).map((h) =>
    '<div class="flex between center" style="gap:10px;padding:8px 0;border-top:1px solid var(--border)">' +
      '<div style="min-width:0">' +
        '<b style="font-size:.9rem">' + esc(h.baslik) + '</b>' +
        (h.one ? ' <span class="badge gold">ÖNE</span>' : '') +
        /* Otomatik geleni ayırt et: yönetici düzeltmek isteyebilir. */
        (h.kaynak ? ' <span class="badge">OTOMATİK</span>' : '') +
        '<div class="muted" style="font-size:.76rem">' + esc(h.tur) + ' · ' + esc(h.tarih) + '</div>' +
      '</div>' +
      '<div class="flex gap-8">' +
        '<button class="btn btn-ghost" style="font-size:.76rem;padding:5px 10px" ' +
          'onclick="haberDuzenle(' + jsArg(h.kimlik) + ')">Düzenle</button>' +
        '<button class="btn btn-ghost" style="font-size:.76rem;padding:5px 10px" ' +
          'onclick="haberSil(' + jsArg(h.kimlik) + ')">Sil</button>' +
      '</div>' +
    '</div>').join('');
}

async function haberEkle(){
  const c = document.getElementById('hbSonuc');
  const govde = {
    tur: document.getElementById('hbTur').value,
    tarih: document.getElementById('hbTarih').value,
    baslik: document.getElementById('hbBaslik').value,
    metin: document.getElementById('hbMetin').value,
    one: document.getElementById('hbOne').checked,
  };
  c.textContent = 'Gönderiliyor…';
  try {
    /* Düzenleme kipindeysek PATCH, değilsek POST. */
    const yol = HB_DUZENLENEN ? '/admin/haber/' + encodeURIComponent(HB_DUZENLENEN) : '/admin/haber';
    const r = await fetch(API_BASE + yol, { method: HB_DUZENLENEN ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify(govde) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { c.textContent = j.message || 'Eklenemedi.'; return; }
    c.textContent = HB_DUZENLENEN ? 'Güncellendi.' : 'Yayınlandı.';
    haberVazgec();
    haberPaneli();
  } catch { c.textContent = 'Bağlantı kurulamadı.'; }
}

/* DÜZENLEME KİPİ. Boşsa yeni kayıt, doluysa var olanı günceller.

   Akış denge duyurusunun SAYILARINI veremiyor (RSS özetinde yok,
   yazının kendisi otomatik erişime kapalı). Yönetici oyun içi
   duyurudaki değerleri buradan yazıyor. */
let HB_DUZENLENEN = null;

async function haberDuzenle(kimlik){
  let liste = [];
  try { liste = (await (await fetch(API_BASE + '/haberler')).json()).items || []; } catch { return; }
  const h = liste.find((x) => x.kimlik === kimlik);
  if (!h) return;
  HB_DUZENLENEN = kimlik;
  document.getElementById('hbTur').value = h.tur;
  document.getElementById('hbTarih').value = h.tarih;
  document.getElementById('hbBaslik').value = h.baslik;
  document.getElementById('hbMetin').value = h.metin || '';
  document.getElementById('hbOne').checked = !!h.one;
  document.getElementById('hbGonder').textContent = 'Güncelle';
  document.getElementById('hbVazgec').hidden = false;
  document.getElementById('hbSonuc').textContent = 'Düzenleniyor: ' + h.baslik;
  document.getElementById('hbBaslik').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function haberVazgec(){
  HB_DUZENLENEN = null;
  document.getElementById('hbBaslik').value = '';
  document.getElementById('hbMetin').value = '';
  document.getElementById('hbOne').checked = false;
  document.getElementById('hbGonder').textContent = 'Yayınla';
  document.getElementById('hbVazgec').hidden = true;
  document.getElementById('hbSonuc').textContent = '';
}

/* DUYURUYU AYRIŞTIR. Sayısal ayrıntılar akıştan gelemiyor (RSS özetinde
   yok, yazının kendisi 403); duyuru zaten oyunun içinde ve Türkçe, o
   yüzden iş yapıştırmayı zahmetsiz kılmak. */
async function duyuruAyristir(){
  const alan = document.getElementById('hbMetin');
  const c = document.getElementById('hbSonuc');
  if (!alan.value.trim()) { c.textContent = 'Önce duyuruyu yapıştır.'; return; }
  c.textContent = 'Ayrıştırılıyor…';
  try {
    const r = await fetch(API_BASE + '/admin/haber/ayristir', { method: 'POST',
      headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ metin: alan.value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { c.textContent = j.message || 'Ayrıştırılamadı.'; return; }
    alan.value = j.metin;
    c.textContent = 'Düzenlendi — kontrol edip yayınla.';
  } catch { c.textContent = 'Bağlantı kurulamadı.'; }
}

async function haberSil(kimlik){
  if (!confirm('Bu haber silinsin mi?')) return;
  try {
    await fetch(API_BASE + '/admin/haber/' + encodeURIComponent(kimlik),
      { method: 'DELETE', credentials: 'same-origin' });
    haberPaneli();
  } catch {}
}

/* Sınama sırasında açılmış hesaplar (guvtest…, bottest… gibi). Yayın
   öncesi temizlik için tek listede toplanıyor.

   Toplu silme AYRI BİR UÇ KULLANMIYOR: her hesap için aynı
   /api/admin/sil çağrılıyor. Yani ikinci bir silme kodu yok ve
   sunucudaki bütün korumalar (yönetici silinemez, adın birebir
   eşleşmesi) aynen geçerli. */
let DENEME = [];
async function denemeleriBul() {
  const bilgi = document.getElementById("yonDeneme");
  bilgi.textContent = "aranıyor…";
  const r = await cagir("/admin/users?deneme=1");
  if (!r.ok) { bilgi.textContent = "listelenemedi"; return; }
  DENEME = r.j.items || [];
  const kutu = document.getElementById("yonListe");
  if (!DENEME.length) {
    bilgi.textContent = "deneme hesabı yok";
    kutu.innerHTML = '<p class="muted" style="margin:0">Deneme hesabı bulunamadı — liste temiz.</p>';
    return;
  }
  bilgi.innerHTML = '<button class="board-del" onclick="denemeleriSil()">' +
    DENEME.length + ' hesabın hepsini sil</button>';
  kutu.innerHTML = '<div class="yon-liste">' + DENEME.map(satir).join("") + '</div>';
}

async function denemeleriSil() {
  if (!DENEME.length) return;
  const adlar = DENEME.map(function (u) { return u.username; }).join(", ");
  if (!confirm(DENEME.length + " deneme hesabı KALICI olarak silinecek:\n\n" +
      adlar.slice(0, 400) + (adlar.length > 400 ? "…" : "") + "\n\nOnaylıyor musunuz?")) return;
  const bilgi = document.getElementById("yonDeneme");
  let ok = 0, hata = 0;
  for (const u of DENEME) {
    bilgi.textContent = "siliniyor… " + (ok + hata + 1) + "/" + DENEME.length;
    const r = await cagir("/admin/sil", { userId: u.id, username: u.username });
    if (r.ok) ok++; else hata++;
  }
  bilgi.textContent = ok + " silindi" + (hata ? ", " + hata + " silinemedi" : "");
  toast(ok + " deneme hesabı silindi.");
  DENEME = [];
  yukle("");
}

/* Elle puan. Sunucu ayrıca denetliyor: yönetici mi, sebep yazılmış mı,
   puan tavanı aşılmış mı. Buradaki kontroller yalnızca kazayı önlüyor. */
async function ellePuan() {
  const ad = document.getElementById("epAd").value.trim();
  const puan = parseInt(document.getElementById("epPuan").value, 10);
  const sebep = document.getElementById("epSebep").value.trim();
  const kutu = document.getElementById("epSonuc");
  if (!ad || !Number.isFinite(puan) || sebep.length < 3) {
    kutu.textContent = "Kullanıcı adı, puan ve sebep (en az 3 harf) gerekli."; return;
  }
  if (!confirm('"' + ad + '" hesabına ' + (puan >= 0 ? "+" : "") + puan + " puan eklenecek.\n\nSebep: " + sebep)) return;
  kutu.textContent = "ekleniyor…";
  const r = await cagir("/board/elle", { username: ad, points: puan, reason: sebep });
  kutu.textContent = r.j.message || (r.ok ? "Eklendi." : "Eklenemedi.");
  if (r.ok) {
    document.getElementById("epPuan").value = "";
    document.getElementById("epSebep").value = "";
  }
}

let araZaman = null;
function araDegisti(v) { clearTimeout(araZaman); araZaman = setTimeout(function(){ yukle(v); }, 250); }

async function yukle(q) {
  const kutu = document.getElementById("yonListe");
  if (!kutu) return;
  kutu.innerHTML = '<p class="muted" style="margin:0">Yükleniyor…</p>';
  const r = await cagir("/admin/users?q=" + encodeURIComponent(String(q || "").trim()));
  if (!r.ok) { kutu.innerHTML = '<p class="muted" style="margin:0">Liste alınamadı.</p>'; return; }
  const sayac = document.getElementById("yonSayac");
  if (sayac) sayac.textContent = r.j.total + " kayıt · " + r.j.yasakli + " yasaklı";
  if (!r.j.items.length) {
    kutu.innerHTML = '<p class="muted" style="margin:0">Eşleşen kullanıcı yok.</p>'; return;
  }
  kutu.innerHTML = '<div class="yon-liste">' + r.j.items.map(satir).join("") + '</div>';
}

/* Bir kullanıcı satırı. Yönetici ve site sahibi için işlem düğmesi
   ÇİZİLMİYOR — sunucu zaten reddediyor, ama olmayan düğmeye basılamaz. */
function satir(u) {
  const korumali = u.owner || u.admin;
  const tarih = u.createdAt
    ? new Date(u.createdAt).toLocaleDateString("tr-TR", { day: "numeric", month: "short", year: "numeric" })
    : "—";
  const yasak = u.ban
    ? '<span class="yon-yasak">yasaklı' + (u.ban.label ? " · " + esc(u.ban.label) : "") + '</span>'
    : "";
  const islem = korumali
    ? '<span class="muted" style="font-size:.72rem">korumalı</span>'
    : (u.ban
        ? '<button class="btn btn-ghost btn-mini" onclick="yasagiKaldir(' + jsArg(u.id) + ',' + jsArg(u.username) + ')">Yasağı kaldır</button>'
        : '<button class="btn btn-ghost btn-mini" onclick="yasakla(' + jsArg(u.id) + ',' + jsArg(u.username) + ')">Yasakla</button>')
      + '<button class="board-msg" title="Bu kişiye doğrudan mesaj yaz" onclick="mesaj('
        + jsArg(u.id) + ',' + jsArg(u.username) + ')">💬 Mesaj</button>'
      + '<button class="board-del" title="Hesabı KALICI olarak sil" onclick="sil('
        + jsArg(u.id) + ',' + jsArg(u.username) + ')">🗑️ Sil</button>';
  return '<div class="yon-satir">' +
    '<span class="yon-av">' + esc(String(u.username).slice(0, 1).toUpperCase()) + '</span>' +
    '<span class="yon-ad">' + esc(u.username) + yasak + '</span>' +
    '<span class="yon-tarih">' + tarih + (u.banCount ? " · " + u.banCount + " ceza" : "") + '</span>' +
    '<span class="yon-islem">' + islem + '</span>' +
  '</div>';
}

/* Doğrudan mesaj. Ödülü verirken doğru kişiye ulaşmanın yolu bu:
   mesaj kullanıcı ADINA değil, satırın KİMLİĞİNE gidiyor, yani
   birinciyi taklit eden biri araya giremiyor. */
async function mesaj(id, ad) {
  const metin = prompt('"' + ad + '" kişisine mesaj:', "");
  if (metin == null) return;
  if (!String(metin).trim()) { toast("Mesaj boş."); return; }
  const r = await cagir("/messages/reply", { userId: id, text: metin });
  toast(r.ok ? '"' + ad + '" kişisine gönderildi.' : (r.j.message || "Gönderilemedi."));
}

async function yasakla(id, ad) {
  const sebep = prompt('"' + ad + '" yasaklansın mı? Sebep:', "Uygunsuz kullanıcı adı");
  if (sebep == null) return;
  const r = await cagir("/admin/ban", { userId: id, reason: sebep });
  toast(r.j.message || (r.ok ? "Yasaklandı." : "Yasaklanamadı."));
  yukle(document.getElementById("yonAra").value);
}

async function yasagiKaldir(id, ad) {
  if (!confirm('"' + ad + '" hesabının yasağı kaldırılsın mı?')) return;
  const r = await cagir("/admin/unban", { userId: id });
  toast(r.j.message || (r.ok ? "Yasak kaldırıldı." : "Kaldırılamadı."));
  yukle(document.getElementById("yonAra").value);
}

/* Silme geri alınamaz: kullanıcı adının birebir yazılması isteniyor ki
   yanlış satıra basmak tek başına hesap silmesin. Aynı kontrol sunucuda
   TEKRAR yapılıyor; buradaki yalnızca kazayı önlüyor. */
async function sil(id, ad) {
  const yazilan = prompt(
    '"' + ad + '" hesabı ve bağlı bütün kayıtları KALICI olarak silinecek.\n\n' +
    'Geri alınamaz. Onaylamak için kullanıcı adını yazın:', "");
  if (yazilan == null) return;
  if (String(yazilan).trim().toLowerCase() !== String(ad).toLowerCase()) {
    toast("Kullanıcı adı eşleşmedi — hesap silinmedi.");
    return;
  }
  const r = await cagir("/admin/sil", { userId: id, username: yazilan });
  toast(r.j.message || (r.ok ? "Silindi." : "Silinemedi."));
  yukle(document.getElementById("yonAra").value);
}
