<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: bu olmadan env(safe-area-inset-*) HER ZAMAN 0 döner,
     yani alt çubuğun iPhone çentik/ana-ekran çubuğu payı hiç uygulanmıyordu. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Klan Arama — HYPNOSHUB</title>
<meta name="description" content="Clash Royale klan profili: üye listesi, roller, bağışlar, klan savaşı kupaları ve klan istatistikleri.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HYPNOSHUB">
<meta property="og:locale" content="tr_TR">
<meta property="og:url" content="https://hypnoshub.pro/klan.html">
<meta property="og:title" content="Klan Ara — HYPNOSHUB">
<meta property="og:description" content="Clash Royale klan profili: üye listesi, roller, bağışlar, klan savaşı kupaları ve klan istatistikleri.">
<meta property="og:image" content="https://hypnoshub.pro/assets/img/hammer-logo.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Klan Ara — HYPNOSHUB">
<meta name="twitter:description" content="Clash Royale klan profili: üye listesi, roller, bağışlar, klan savaşı kupaları ve klan istatistikleri.">
<meta name="twitter:image" content="https://hypnoshub.pro/assets/img/hammer-logo.jpg">
<link rel="icon" href="assets/img/hammer-logo.jpg">
<link rel="apple-touch-icon" href="assets/img/hammer-logo.jpg">
<meta name="theme-color" content="#1e5ae0">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div id="app-header"></div>

<section class="page-strip">
  <div class="container">
    <p class="eyebrow" data-i18n="home.clan.sub">Klan üyelerini ve bağışları incele</p>
    <h1 data-i18n="home.clan.title">KLAN ARAMA</h1>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="search-box" style="border-radius:12px;max-width:520px;margin-bottom:8px">
      <input id="clanTag" type="text" placeholder="Klan adı veya etiketi (#9YQ2VG0P)" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')runSearch(this.value)">
      <button class="search-go" onclick="runSearch(document.getElementById('clanTag').value)"></button>
    </div>
    <p class="muted" style="font-size:.8rem;margin:0 0 18px">En az 3 harf girin — eşleşen klanlar rozetleriyle listelenir. Etiket girerseniz doğrudan o klan açılır.</p>

    <div id="results" style="margin-bottom:20px"></div>

    <!-- Clan detail: header + member table (hidden until a clan is opened) -->
    <div id="clanDetail" style="display:none">
      <div class="card" id="clanHead" style="margin-bottom:20px"></div>
      <div class="search-box" style="border-radius:12px;max-width:360px;margin-bottom:12px">
        <input id="memberFilter" type="text" placeholder="Üyeler içinde ara..." style="flex:1;min-width:0" oninput="paintMembers()">
        <button class="search-go" onclick="paintMembers()" id="memberFilterBtn"></button>
      </div>
      <div class="table-wrap">
        <table class="data">
          <thead><tr>
            <th data-i18n="col.no">NO</th>
            <th data-i18n="col.player">OYUNCU</th>
            <th data-i18n="col.role">ROL</th>
            <th data-i18n="col.level">SEVİYE</th>
            <th data-i18n="col.trophy">KUPA</th>
            <th>NİHAİ KADEME</th>
            <th data-i18n="col.donation">BAĞIŞ</th>
          </tr></thead>
          <tbody id="memberBody"></tbody>
        </table>
      </div>
      <p class="muted mt-8" style="font-size:.82rem" id="memberCount"></p>
    </div>
  </div>
</section>

<div id="app-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome("");
document.querySelector(".search-go[onclick^='runSearch']").innerHTML = ICONS.search;
document.getElementById("memberFilterBtn").innerHTML = ICONS.search;
attachSuggest(document.getElementById("clanTag"), () => "clan");

const RES = document.getElementById("results");
const DETAIL = document.getElementById("clanDetail");
const roleColor = { "Lider":"gold","Yardımcı Lider":"green","Büyük":"","Üye":"" };
let MEMBERS = [];

function paintClan(data){
  const info = data.info;
  MEMBERS = data.members;
  DETAIL.style.display = "";
  document.getElementById("clanHead").innerHTML = `
    <div class="flex between center wrap gap-16">
      <div class="flex center gap-12">
        ${clanCrest(info.badge, 56)}
        <div>
          <h2 style="margin:0;font-size:1.4rem">${info.name} <span class="tag">${info.tag}</span></h2>
          <span class="muted" style="font-size:.85rem">${clanTypeTR(info.type)} · ${info.region||"—"}</span>
          ${info.description ? `<p class="muted" style="font-size:.82rem;margin:6px 0 0;max-width:52ch">${info.description}</p>` : ""}
        </div>
      </div>
      <div class="flex gap-16 wrap">
        <div class="stat-tile"><div class="k">Klan Skoru</div><div class="v trophy">${nfTR(info.score)}</div></div>
        <div class="stat-tile"><div class="k">Savaş Kupası</div><div class="v">${nfTR(info.warTrophies)}</div></div>
        <div class="stat-tile"><div class="k">Üye</div><div class="v">${info.members||MEMBERS.length}/50</div></div>
        <div class="stat-tile"><div class="k">Gerekli Kupa</div><div class="v">${nfTR(info.required)}</div></div>
        <div class="stat-tile"><div class="k">Haftalık Bağış</div><div class="v">${nfTR(info.donations)}</div></div>
      </div>
    </div>`;
  document.getElementById("memberFilter").value = "";
  paintMembers();
}

/* Members are filtered in the browser: the whole 50-player list is already in
   hand, so name search inside a clan costs no extra API call. */
function paintMembers(){
  const q = (document.getElementById("memberFilter").value || "").toLocaleLowerCase("tr").trim();
  const rows = !q ? MEMBERS : MEMBERS.filter(m =>
    m.name.toLocaleLowerCase("tr").includes(q) || m.tag.toLowerCase().includes(q));
  document.getElementById("memberBody").innerHTML = rows.map(m=>`
    <tr>
      <td class="rank">${m.no}</td>
      <td><a class="player-link" href="oyuncu.html?tag=${encodeURIComponent(m.tag)}">${esc(m.name)}</a> <span class="tag">${esc(m.tag)}</span>
          ${/* Tek başına "Spirit Square" yazınca ne olduğu anlaşılmıyordu —
                bu, oyuncunun bulunduğu arena. Adı da Türkçeleştirildi. */""}
          ${m.arena ? `<div class="muted" style="font-size:.74rem" title="${LANG==="tr"?"Oyuncunun bulunduğu arena":"The player's current arena"}">Arena: ${esc(m.arena)}</div>` : ""}</td>
      <td><span class="badge ${roleColor[m.role]||''}">${m.role}</span></td>
      <td>${m.level ? `<b>${m.level}</b>` : `<span class="muted">—</span>`}</td>
      <td class="trophy">${nfTR(m.trophies)}</td>
      ${/* PoL medals reset to 0 each season, so 0 means "has not played ranked
            this season" rather than a real score — show a dash, not a zero. */""}
      <td>${m.medals
            ? `<b>${polScore(m.medals, 15)}</b>${m.worldRank ? `<div class="muted" style="font-size:.72rem">Dünya #${nfTR(m.worldRank)}</div>` : ""}`
            : `<span class="muted" title="Bu sezon Nihai Kademe oynamamış">—</span>`}</td>
      <td class="muted">${m.donations}</td>
    </tr>`).join("") || `<tr><td colspan="7" class="muted text-center" style="padding:20px">Eşleşen üye yok.</td></tr>`;
  document.getElementById("memberCount").textContent =
    q ? `${MEMBERS.length} üyeden ${rows.length} tanesi gösteriliyor` : `${MEMBERS.length} üye`;
}

async function runSearch(input){
  const q = (input || "").trim();
  document.getElementById("clanTag").value = q;
  DETAIL.style.display = "none";
  if (!q){
    RES.innerHTML = notice(`<span>🔎</span><span>Bir klan <b>adı</b> (en az 3 harf) ya da <b>etiketi</b> girin.</span>`);
    return;
  }
  if (looksLikeTag(q)) return openClan(normTag(q));

  if (q.length < 3){
    RES.innerHTML = notice(`<span>✏️</span><span>Klan adı araması için en az <b>3 harf</b> gerekiyor.</span>`);
    return;
  }

  RES.innerHTML = spinnerBox(`“${q}” aranıyor…`);
  const r = await HypnoAPI.clansSearch(q);
  paintApiStatus();
  if (r === null){
    RES.innerHTML = notice(`<span>⚠️</span><span>Sunucuya ulaşılamadı, arama yapılamıyor. Proxy çalışıyor mu? (<code>npm start</code>)</span>`);
    return;
  }
  if (!r.items.length){
    RES.innerHTML = notice(`<span>🔍</span><span><b>“${q}”</b> adıyla eşleşen klan bulunamadı.</span>`);
    return;
  }
  RES.innerHTML = `<div class="res-list">
    <div class="res-head"><b>“${q}” için ${r.items.length} klan</b>
      <span class="muted" style="margin-left:auto">Clash Royale API klan araması</span></div>
    ${r.items.map(clanResultRow).join("")}
  </div>`;
}

async function openClan(tag){
  RES.innerHTML = spinnerBox(`${tag} yükleniyor…`);
  const data = await HypnoAPI.clan(tag);
  paintApiStatus();
  if (data.offline){
    RES.innerHTML = notice(`<span>⚠️</span><span>Sunucuya ulaşılamadı. Proxy çalışıyor mu? (<code>npm start</code>)</span>`);
    return;
  }
  /* 404 = gerçekten yok; 403/429/5xx = biz çekemedik. İkisini ayırıyoruz,
     yoksa API'ye erişemediğimizde var olan klan yokmuş gibi görünüyor. */
  if (data.notFound && data.status !== 404){
    RES.innerHTML = notice(`<span>⚠️</span><span><b>Veri alınamadı.</b> Klan bilgisi Clash Royale API'sinden çekilemedi${data.status?` (hata ${data.status})`:""} — bu, klanın olmadığı anlamına gelmez. Birazdan tekrar deneyin.</span>`, "warn");
    return;
  }
  if (data.notFound){
    RES.innerHTML = notice(`<span>🔍</span><span><b>${esc(tag)}</b> etiketiyle bir klan bulunamadı. Etiketi kontrol edin — harfler <b>0289PYLQGRJCUV</b> arasından gelir (O, I, S yoktur).</span>`);
    return;
  }
  RES.innerHTML = "";
  paintClan(data);
}

(function(){
  const params = new URLSearchParams(location.search);
  runSearch(params.get("q") || params.get("tag") || "");
})();
window.onLangChange = paintApiStatus;
window.repaint = () => { const q = document.getElementById('clanTag').value; if (q) runSearch(q); };
</script>
</body>
</html>
