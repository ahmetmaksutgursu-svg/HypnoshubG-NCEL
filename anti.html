<body>
<div id="app-header"></div>

<section class="page-strip">
  <div class="container">
    <p class="eyebrow">KARŞINDAKİ DESTEYİ SEÇ — ONU YENENLERİ GÖSTERELİM</p>
    <h1>ANTİ DESTE</h1>
    <p><span class="api-status" data-api-status style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#eaf0fb"><span class="led"></span>Veri alınamadı</span></p>
  </div>
</section>

<section class="section">
  <div class="container">

    <!-- Sonuç YUKARIDA duruyor: seçim yapıldığında kullanıcı zaten oraya
         kaydırılıyor ve yeni bir deste seçmek için listeye geri dönebiliyor. -->
    <div id="sonuc"></div>

    <div class="card" id="secimKart">
      <div class="card-head"><span class="dot">🛡️</span><h3>Hangi desteye karşı oynuyorsun?</h3></div>
      <p class="muted" style="font-size:.84rem;margin:0 0 12px">
        Desteye <b>dokun</b>, onu yenen desteler çıksın.
      </p>
      <div class="anti-koclar" id="kocRow"></div>
      <div id="desteListe" class="anti-liste"></div>
      <button class="btn btn-ghost" id="dahaBtn" hidden onclick="dahaGoster()" style="margin-top:12px;width:100%">
        Daha fazla deste göster
      </button>
    </div>
  </div>
</section>

<div id="app-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
mountChrome("anti.html");
const TRL = () => LANG === "tr";
const ILK_GOSTER = 8;         // listede başlangıçta görünen deste sayısı
const ANTI_SAYI  = 5;         // sonuçta gösterilen anti deste sayısı
let LISTE = null, KOCLAR = [], SECIM = null, hepsiAcik = false;

/* Sunucudan gelen meta destesini ekranda kullanılabilir hâle getirir. */
function desteCevir(d){
  const cards = [], evo = [], champ = [], hero = [];
  (d.cards || []).forEach((c) => {
    const k = registerApiCard(c);
    cards.push(k);
    if (c.evo) evo.push(k);
    if (c.hero) hero.push(k);
    if (c.champion) champ.push(k);
  });
  return { ...d, cards, evo, champ, hero, name: nameDeck(cards) };
}

/* Sekiz kart TEK SIRADA. İki satır hâlinde çizmek her desteyi iki kat
   uzatıyordu ve telefonda listeye ancak iki deste sığıyordu. */
function kartSirasi(d){
  const ciz = (c) => renderCard(c, { evo:(d.evo||[]).includes(c),
    heroSlot:(d.hero||[]).includes(c), hero:(d.champ||[]).includes(c) });
  return `<span class="as-kartlar">${d.cards.map(ciz).join("")}</span>`;
}

/* ---------- 1. adım: seçim listesi ---------- */
function cizSecim(){
  document.getElementById("kocRow").innerHTML = KOCLAR.map((k) => `
    <button class="anti-koc ${SECIM && SECIM.kocId === k.id && !SECIM.key ? "secili" : ""}"
            onclick="secKoc(${k.id})" title="${k.mac} maç · ${k.desteSayisi} deste">
      ${esc(cardName({ name: k.ad }))}
    </button>`).join("");

  const goster = hepsiAcik ? LISTE.length : Math.min(ILK_GOSTER, LISTE.length);
  document.getElementById("desteListe").innerHTML = LISTE.slice(0, goster).map((d, i) => `
    <button class="anti-satir ${SECIM && SECIM.key === d.key ? "secili" : ""}" onclick="secDeste(${i})">
      <span class="as-ust">
        <span class="as-ad">${esc(d.name)}</span>
        <span class="as-bilgi">💧 ${deckElixir(d.cards)}${d.usage != null ? ` · %${d.usage}` : ""}</span>
      </span>
      ${kartSirasi(d)}
    </button>`).join("");

  const btn = document.getElementById("dahaBtn");
  btn.hidden = hepsiAcik || LISTE.length <= ILK_GOSTER;
  btn.textContent = TRL() ? `Daha fazla deste göster (${LISTE.length - goster})`
                          : `Show more decks (${LISTE.length - goster})`;
}
function dahaGoster(){ hepsiAcik = true; cizSecim(); }

function secDeste(i){
  const d = LISTE[i];
  SECIM = { key: d.key, name: d.name, kocId: d.koc?.id || null,
            ids: d.cards.map((k) => CARD_DB[k]?.id).filter(Boolean).join(",") };
  cizSecim();
  bul({ deste: SECIM.ids }, d.name);
}
function secKoc(id){
  const k = KOCLAR.find((x) => x.id === id);
  if (!k) return;
  SECIM = { key: null, name: cardName({ name: k.ad }), kocId: id };
  cizSecim();
  bul({ koc: id }, TRL() ? `${cardName({ name: k.ad })} desteleri` : `${k.ad} decks`);
}

/* ---------- 2. adım: sonuç ---------- */
async function bul(sorgu, baslik){
  const kutu = document.getElementById("sonuc");
  kutu.innerHTML = `<div class="card">${spinnerBox(TRL() ? "Eşleşmeler taranıyor…" : "Scanning matchups…")}</div>`;
  window.scrollTo({ top: 0, behavior: "smooth" });
  const d = await HypnoAPI._get("/anti?" + new URLSearchParams(sorgu).toString(), 20000);
  paintApiStatus();
  if (!d) { kutu.innerHTML = apiDownBox("yenile"); return; }
  if (d.kocYok) { kutu.innerHTML = notice(`<span>🤔</span><span>${esc(d.mesaj || "")}</span>`, "warn"); return; }
  ciz(d, baslik);
}
function yenile(){
  if (!SECIM) return;
  if (SECIM.ids) bul({ deste: SECIM.ids }, SECIM.name);
  else if (SECIM.kocId) secKoc(SECIM.kocId);
}

/* Aynı arketipin iki destesi AYNI adı alıyor (nameDeck adı kazanma
   koşulundan üretiyor), yani yan yana iki "BALON DESTESİ" çıkıyordu ve
   hangisinin hangi oran olduğu anlaşılmıyordu. Burada her desteye onu
   diğerlerinden AYIRAN kart ekleniyor.

   Tek kart yetmeyebiliyor: iki deste aynı "en pahalı farklı kartı"
   paylaşıp başka yerde ayrışabiliyor. O yüzden adaylar kart ekleyerek
   uzatılıyor ve ilk BENZERSİZ olan seçiliyor. */
function adlariAyir(desteler){
  if (desteler.length < 2) return desteler;
  const ortak = desteler[0].cards.filter((k) => desteler.every((d) => d.cards.includes(k)));
  const kullanilan = new Set();
  return desteler.map((d) => {
    const fark = d.cards.filter((k) => !ortak.includes(k))
      .sort((a, b) => (CARD_DB[b]?.elixir || 0) - (CARD_DB[a]?.elixir || 0));
    const adaylar = [d.name, ...fark.map((_, i) =>
      d.name + " · " + fark.slice(0, i + 1).map(cardNameOf).join(" + "))];
    let ad = adaylar.find((a) => !kullanilan.has(a));
    if (!ad) { let n = 2; ad = d.name + " (" + n + ")"; while (kullanilan.has(ad)) ad = d.name + " (" + (++n) + ")"; }
    kullanilan.add(ad);
    return { ...d, name: ad };
  });
}

function ciz(d, baslik){
  const hedefAd = esc(cardName({ name: d.secilen.koc.ad }));
  const anti = (d.sayac || []).filter((x) => x.yuzde >= d.esik).slice(0, ANTI_SAYI);
  const kutu = document.getElementById("sonuc");

  const bas = `
    <div class="anti-bas-kart card">
      <h2 style="margin:0 0 4px;font-size:1.15rem">${esc(baslik)} <span class="muted" style="font-weight:600">${TRL()?"antisi":"counters"}</span></h2>
      <p class="muted" style="font-size:.8rem;margin:0">
        ${TRL()
          ? `Arketip: <b>${hedefAd}</b>. Aşağıdaki oranlar <b>her destenin KENDİ</b> oranıdır —
             o destenin ${hedefAd} destelerine karşı ${nfTR(d.savas)} maçlık kayıttaki karnesi.
             Kaynak: Nihai Kademe ilk 1000, iki tarafı da sıralamada olan maçlar.
             Sıralama ham yüzdeye değil kesinliğe göre; ± payı yanında yazıyor.`
          : `Archetype <b>${hedefAd}</b>. Each rate belongs to that specific deck, measured against
             ${hedefAd} decks in the Path of Legends top 1000.`}
      </p>
    </div>`;

  if (!anti.length){
    kutu.innerHTML = bas + notice(`<span>🛡️</span><span>${TRL()
      ? `<b>${hedefAd}</b> destelerine karşı %${d.esik} ve üzeri bir meta destesi henüz bulunamadı —
         ya bu arketip dengeli, ya da hücreler ${nfTR(d.minOrnek)} maçlık eşiği yeni geçiyor.
         Tablo her gün büyüyor.`
      : `No meta deck beats <b>${hedefAd}</b> at ${d.esik}% or above yet.`}</span>`)
      + ((d.sayac || []).length ? `<div class="card"><h4 style="margin:0 0 10px;font-size:.92rem">${
          TRL()?"Eşiğe en yakın desteler":"Closest decks"}</h4>${
          d.sayac.slice(0, 5).map((x) => `<div class="anti-kisa">
            <span class="anti-kisa-p ${x.yuzde>=50?"iyi":""}">%${Math.round(x.yuzde)}</span>
            <span><b>${esc(nameDeck(desteCevir(x).cards))}</b></span>
            <span class="muted" style="margin-left:auto">${nfTR(x.n)} ${TRL()?"maç":"games"}</span>
          </div>`).join("")}</div>` : "");
    return;
  }

  /* Adları önce ayır: iki farklı Balon destesi aynı ada düşüp hangi
     oranın hangisine ait olduğu anlaşılmıyordu. */
  const cizilecek = adlariAyir(anti.map(desteCevir));
  kutu.innerHTML = bas + anti.map((x, i) => {
    const dd = cizilecek[i];
    const p = Math.round(x.yuzde);
    const link = copyDeckLink(dd.cards);
    return `
    <div class="card anti-sonuc">
      <div class="as-ust">
        <span class="as-sira">${i + 1}</span>
        <span class="as-yuzde">%${p}</span>
        <span class="as-ad">${esc(dd.name)}
          <span class="muted">${hedefAd} ${TRL()?"destelerine karşı":"decks"} · ${nfTR(x.n)} ${TRL()?"maç":"games"} · ±${Math.round(x.pay)}</span>
        </span>
      </div>
      <div class="anti-cubuk"><span style="width:${p}%"></span></div>
      ${kartSirasi(dd)}
      <div class="as-alt">
        <span class="elixir-badge">💧 ${deckElixir(dd.cards)}</span>
        ${x.usage != null ? `<span class="muted">${TRL()?"kullanım":"usage"} %${x.usage}</span>` : ""}
        ${link ? `<button class="btn btn-primary as-kopya" onclick="openDeck(${jsArg(link)},this)">
            ${ICONS.copy} ${TRL() ? "Desteyi Kopyala" : "Copy deck"}</button>` : ""}
      </div>
    </div>`;
  }).join("") + `<p class="muted" style="font-size:.78rem;margin:0 0 18px">${TRL()
      ? "Kopyala düğmesi desteyi oyunda açar; telefonda doğrudan deste kopyalama ekranına düşer."
      : "Copy opens the deck in game."}</p>`;
}

/* ---------- açılış ---------- */
async function yukle(){
  const liste = document.getElementById("desteListe");
  liste.innerHTML = spinnerBox(TRL() ? "Meta desteleri yükleniyor…" : "Loading meta decks…");
  /* Eşleşme tablosu deste ADLARINI belirliyor (nameDeck onu kaynak alıyor),
     o yüzden desteler çevrilmeden önce yüklenmeli. */
  await eslesmeYukle();
  const d = await HypnoAPI._get("/anti/desteler", 30000);
  paintApiStatus();
  if (!d || !d.items || !d.items.length){
    liste.innerHTML = "";
    document.getElementById("sonuc").innerHTML = apiDownBox("yukle");
    return;
  }
  LISTE = d.items.map(desteCevir);
  KOCLAR = d.koclar || [];
  cizSecim();
  /* ?koc=<id> · ?kartlar=<id,id,…>&ad=<ad> · ?deste=<meta anahtarı> */
  const q = new URLSearchParams(location.search);
  if (q.get("koc")) secKoc(parseInt(q.get("koc"), 10));
  else if (q.get("kartlar")){
    const ids = q.get("kartlar").split(",").filter(Boolean).join(",");
    const ad = q.get("ad") || (TRL() ? "Seçilen deste" : "Selected deck");
    SECIM = { key: null, name: ad, kocId: null, ids };
    bul({ deste: ids }, ad);
  }
  else if (q.get("deste")){
    const i = LISTE.findIndex((x) => x.key === q.get("deste"));
    if (i >= 0) secDeste(i);
  }
}
yukle();
window.onLangChange = () => { paintApiStatus(); yukle(); };
window.repaint = () => yukle();
</script>
